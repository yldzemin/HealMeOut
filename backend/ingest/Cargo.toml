[package]
name = "astra-ingest"
version = "0.1.0"
edition = "2024"
publish = false
description = "Builds ASTRA-TWIN data/cache/*.json from raw NASA files"

# Versions are pinned by the committed Cargo.lock.
[dependencies]
anyhow = "1"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
